<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fintech Wallet - Inicio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #000; }
        .bg-custom-dark { background-color: #0b1120; }
        .card-custom { background-color: #111827; border: 1px solid #1f2937; }
        .btn-gold { background-color: #e5d399; color: #111827; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="bg-custom-dark w-full max-w-md min-h-[600px] rounded-[30px] shadow-2xl p-8 flex flex-col justify-center">
        
        <!-- Header -->
        <div class="text-center mb-10">
            <div class="w-24 h-24 rounded-full bg-[#1f2937] flex items-center justify-center mx-auto mb-4 border border-gray-600">
                <span class="text-white font-serif text-3xl font-bold">FW</span>
            </div>
            <h1 class="text-white text-2xl font-bold tracking-wide">Fintech Wallet</h1>
            <p class="text-gray-400 text-sm mt-2">Acceso a tu inversión</p>
        </div>

        <!-- Formulario estilo 1000143861.jpg -->
        <form onsubmit="handleLogin(event)" class="space-y-4">
            <div class="bg-[#1f2937] rounded-2xl overflow-hidden border border-gray-700">
                <input type="tel" id="login-phone" required class="w-full bg-transparent px-5 py-4 text-white placeholder-gray-500 focus:outline-none" placeholder="Número de Celular">
            </div>

            <div class="bg-[#1f2937] rounded-2xl overflow-hidden border border-gray-700">
                <input type="password" id="login-password" required class="w-full bg-transparent px-5 py-4 text-white placeholder-gray-500 focus:outline-none" placeholder="Contraseña">
            </div>

            <button type="submit" class="w-full btn-gold font-bold py-4 rounded-2xl text-center text-lg transition-opacity hover:opacity-90 mt-6" id="btn-login-submit" disabled>
                Acceder
            </button>
        </form>

        <div class="mt-8 text-center">
            <a href="registro.html" class="text-gray-500 hover:text-white text-sm uppercase tracking-widest font-semibold">¿No tienes cuenta? Regístrate</a>
        </div>

    </div>

    <script>
        const loginPhone = document.getElementById('login-phone');
        const loginPass = document.getElementById('login-password');
        const btnLoginSubmit = document.getElementById('btn-login-submit');

        function validateInputs() {
            if (loginPhone.value.trim() !== "" && loginPass.value.trim() !== "") {
                btnLoginSubmit.disabled = false;
                btnLoginSubmit.classList.add('opacity-100');
            } else {
                btnLoginSubmit.disabled = true;
            }
        }
        loginPhone.addEventListener('input', validateInputs);
        loginPass.addEventListener('input', validateInputs);

        function handleLogin(event) {
            event.preventDefault();
            // Lógica de validación...
            alert('Ingreso procesado');
        }
    </script>
</body>
</html>
