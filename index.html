<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fintech Wallet - Inicio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #000; }
        .bg-custom-dark { background-color: #0b1120; }
        .input-dark { background: #1f2937; border: 1px solid #374151; color: white; }
        .btn-gold { background-color: #e5d399; color: #111827; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-custom-dark w-full max-w-md min-h-[600px] rounded-[30px] shadow-2xl p-8 flex flex-col justify-center">
        <div class="text-center mb-10">
            <div class="w-24 h-24 rounded-full bg-[#1f2937] flex items-center justify-center mx-auto mb-4 border border-gray-600">
                <span class="text-white font-serif text-3xl font-bold">FW</span>
            </div>
            <h1 class="text-white text-2xl font-bold tracking-wide">Fintech Wallet</h1>
        </div>
        <form onsubmit="handleLogin(event)" class="space-y-4">
            <input type="tel" id="login-phone" required class="w-full input-dark py-4 px-5 rounded-2xl focus:outline-none" placeholder="Número de Celular">
            <input type="password" id="login-password" required class="w-full input-dark py-4 px-5 rounded-2xl focus:outline-none" placeholder="Contraseña">
            <button type="submit" id="btn-login-submit" class="w-full btn-gold font-bold py-4 rounded-2xl text-center text-lg mt-6 hover:opacity-90">
                Acceder
            </button>
        </form>
        <div class="mt-8 text-center">
            <a href="registro.html" class="text-gray-500 hover:text-white text-sm uppercase tracking-widest font-semibold">¿No tienes cuenta? Regístrate</a>
        </div>
    </div>
    <script>
        const loginPhone = document.getElementById('login-phone');
        const loginPass = document.getElementById('login-password');
        const btnLoginSubmit = document.getElementById('btn-login-submit');

        function handleLogin(event) {
            event.preventDefault();
            
            // Cambiamos el comportamiento: en lugar de un alerta fijo, 
            // simulamos el proceso y enviamos al usuario al menú
            btnLoginSubmit.innerText = "PROCESANDO...";
            btnLoginSubmit.disabled = true;

            // Simulamos una verificación rápida y redireccionamos
            setTimeout(() => {
                alert('¡Credenciales verificadas exitosamente!');
                window.location.href = "menu.html"; 
            }, 1500);
        }
    </script>
</body>
</html>
