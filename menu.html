o<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú - Kanguroo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #000; }
        .bg-custom-dark { background-color: #0b1120; }
        .card-custom { background-color: #111827; border: 1px solid #1f2937; }
        .btn-gold { background-color: #e5d399; color: #111827; }
        .btn-menu { background-color: #1f2937; color: white; border: 1px solid #374151; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="bg-custom-dark w-full max-w-md min-h-[600px] rounded-[30px] shadow-2xl p-8 flex flex-col">
        <div class="flex justify-between items-center mb-8">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-gray-700 flex items-center justify-center text-white font-bold">A</div>
                <h1 class="text-white font-bold uppercase tracking-wide">Hola, Angel</h1>
            </div>
            <div class="text-gray-400">👁️ 🔔</div>
        </div>

        <div class="card-custom rounded-[24px] p-6 mb-8">
            <p class="text-gray-400 text-sm mb-1">Balance Actual</p>
            <div class="flex items-baseline">
                <h2 class="text-white text-4xl font-bold" id="usdDisplay">$0.01</h2>
                <span class="text-gray-500 font-bold ml-2">USDC</span>
            </div>
            <p class="text-emerald-400 font-bold mt-2" id="bobDisplay">Bs.0.10 BOB</p>
        </div>

        <div class="space-y-4">
            <button onclick="window.location.href='depositos.html'" class="w-full btn-gold font-bold py-4 rounded-2xl flex justify-between px-6 hover:opacity-90">
                <span>➕ Agregar Fondos</span>
                <span>→</span>
            </button>

            <button class="w-full btn-menu py-4 rounded-2xl flex justify-between px-6 hover:bg-gray-700">
                <span>➖ Retirar Fondos</span>
                <span>→</span>
            </button>

            <button class="w-full btn-menu py-4 rounded-2xl flex justify-between px-6 hover:bg-gray-700">
                <span>📊 Historial</span>
                <span>→</span>
            </button>
        </div>
    </div>
</body>
</html>
